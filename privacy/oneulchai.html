<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DayDelta privacy policy">
  <title>DayDelta Privacy Policy | MEGI MINT</title>
  <link rel="stylesheet" href="../common/css/privacy.css">
  <link rel="stylesheet" href="../common/css/i18n.css">
  <script src="../common/js/i18n.js" defer></script>
  <script src="../common/locales/en.js" defer></script>
  <script src="../common/locales/ko.js" defer></script>
  <script src="../common/locales/ja.js" defer></script>
  <script src="../apps/oneulchai/privacy/policy.js" defer></script>
</head>
<body>
  <header class="policy-header">
    <div class="policy-header__inner">
      <a class="brand" href="../index.html" aria-label="MEGI MINT home" data-i18n-aria-label="common.brandHome">
        <img src="../img/brand/mm-logo.png" alt="" class="brand__mark">
        <span>MEGI MINT</span>
      </a>
      <div class="mm-header-actions">
        <div class="mm-language-control">
          <label class="mm-sr-only" for="mm-language-privacy" data-i18n="common.language">Language</label>
          <select id="mm-language-privacy" class="mm-language-select" aria-label="Language" data-i18n-aria-label="common.language">
            <option value="en">English</option>
            <option value="ko">한국어</option>
            <option value="ja">日本語</option>
          </select>
        </div>
        <a class="home-link" href="../index.html" data-i18n="common.backHome">Back to home</a>
      </div>
    </div>
  </header>

  <main class="policy-main">
    <div class="policy-shell">
      <div id="policy-content" aria-busy="true">
        <p class="policy-status" role="status">Loading privacy policy…</p>
        <p class="policy-fallback-links">
          <a href="../apps/oneulchai/privacy/en.html">English</a> ·
          <a href="../apps/oneulchai/privacy/ko.html">한국어</a> ·
          <a href="../apps/oneulchai/privacy/ja.html">日本語</a>
        </p>
      </div>
      <noscript>
        <p class="policy-status">JavaScript is required for language switching. Choose a language above to read the full policy.</p>
      </noscript>
      <footer class="policy-footer">
        <a class="brand brand--footer" href="../index.html">
          <img src="../img/brand/mm-logo.png" alt="" class="brand__mark">
          <span>MEGI MINT</span>
        </a>
        <p id="policy-app-name">DayDelta</p>
      </footer>
    </div>
  </main>
</body>
</html>
